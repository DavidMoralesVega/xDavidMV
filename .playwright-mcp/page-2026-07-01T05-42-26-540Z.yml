        - paragraph [ref=f104e84]: PWA mobile-first, offline-first e instalable que pone en el celular del cooperativista minero la fórmula completa de la Ley 535 boliviana para verificar si la liquidación que le paga la comercializadora es justa. Incluye un panel administrativo (Observatorio de liquidaciones mineras) para CISEP/FEDECOMIN. Reescritura completa del legacy V3.
        - generic [ref=f104e87]:
          - generic [ref=f104e88]:
            - heading "01 El reto" [level=2] [ref=f104e89]:
              - generic [ref=f104e90]: "01"
              - text: El reto
            - paragraph [ref=f104e91]: En Bolivia ~9 de cada 10 mineros son cooperativistas y la mayoría no puede verificar el cálculo de su boleta de liquidación (pesos, leyes, humedad, mermas, cotizaciones, Regalía Minera y decenas de descuentos). La asimetría de información se traduce en menor ingreso familiar; había que operacionalizar el derecho a información (Art. 87h/89) con un motor de cálculo fiel a la norma y datos oficiales actualizados.
          - generic [ref=f104e92]:
            - heading "02 La solución" [level=2] [ref=f104e93]:
              - generic [ref=f104e94]: "02"
              - text: La solución
            - paragraph [ref=f104e95]: Construí un motor de cálculo determinista de la Regalía Minera (alícuota Art. 227 en escala dinámica por mineral, DS 29577, T/C dual) replicado en cliente y en Cloud Functions, validado contra recibos reales al céntimo. Automaticé la ingesta de cotizaciones SENARECOM y tipo de cambio BCB con scrapers cron idempotentes, integré OCR de boletas con Gemini y levanté un Observatorio con KPIs y reclamos Art. 89, todo serverless a costo ~$0/año.
        - generic [ref=f104e97]:
